spring.application.name=coldtrace-monitoring-service
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_monitoring?serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_monitoring}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
coldtrace.identity.url=${IDENTITY_URL:http://localhost:8090}
logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%level","correlationId":"%X{correlationId}","logger":"%logger{32}","message":"%msg"}%n
