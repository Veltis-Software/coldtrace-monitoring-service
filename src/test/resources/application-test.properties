spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:monitoring;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USER:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
coldtrace.gap.initial-delay-ms=3600000
coldtrace.gap.interval-ms=3600000
